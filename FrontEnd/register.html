<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - FoodieHub</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <header class="header"></header>

  <main class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-icon">🍔</div>
        <h2>Create Account</h2>
        <p>Join FoodieHub and start ordering</p>
      </div>

      <form class="auth-form" id="registerForm">
        <div class="error-message" id="errorMsg"></div>

        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" placeholder="John Doe" required maxlength="50">
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="you@example.com" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-group">
            <input type="password" id="password" placeholder="Min 6 characters" required minlength="6">
            <button type="button" class="toggle-password" onclick="togglePassword('password')">👁</button>
          </div>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <div class="input-group">
            <input type="password" id="confirmPassword" placeholder="Re-enter password" required minlength="6">
            <button type="button" class="toggle-password" onclick="togglePassword('confirmPassword')">👁</button>
          </div>
        </div>

        <div class="form-group">
          <label for="phone">Phone Number (optional)</label>
          <input type="tel" id="phone" placeholder="(555) 123-4567">
        </div>

        <div class="form-group">
          <label for="address">Delivery Address (optional)</label>
          <input type="text" id="address" placeholder="123 Main Street, Apt 4B">
        </div>

        <button type="submit" class="btn btn-primary submit-btn">Create Account</button>

        <div class="auth-footer">
          Already have an account? <a href="login.html">Login</a>
        </div>
      </form>
    </div>
  </main>

  <footer class="footer"></footer>

  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script>
    function init() {
      renderHeader();
      renderFooter();

      if (Auth.isLoggedIn()) {
        window.location.href = 'index.html';
        return;
      }
    }

    function togglePassword(fieldId) {
      const field = document.getElementById(fieldId);
      const btn = field.nextElementSibling;
      if (field.type === 'password') {
        field.type = 'text';
        btn.textContent = '🙈';
      } else {
        field.type = 'password';
        btn.textContent = '👁';
      }
    }

    function showError(message) {
      const el = document.getElementById('errorMsg');
      el.textContent = message;
      el.classList.add('show');
    }

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      document.getElementById('errorMsg').classList.remove('show');

      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const phone = document.getElementById('phone').value;
      const address = document.getElementById('address').value;

      if (password !== confirmPassword) {
        showError('Passwords do not match');
        return;
      }

      try {
        await Auth.register({ name, email, password, phone, address });
        showToast('Account created successfully!', 'success');
        setTimeout(() => window.location.href = 'index.html', 500);
      } catch (err) {
        showError(err.message);
      }
    });

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
