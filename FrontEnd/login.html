<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - FoodieHub</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <header class="header"></header>

  <main class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-icon">🍔</div>
        <h2>Welcome Back</h2>
        <p>Login to your FoodieHub account</p>
      </div>

      <form class="auth-form" id="loginForm">
        <div class="error-message" id="errorMsg"></div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="you@example.com" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-group">
            <input type="password" id="password" placeholder="Enter your password" required minlength="6">
            <button type="button" class="toggle-password" onclick="togglePassword('password')">👁</button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary submit-btn">Login</button>

        <div class="auth-links">
          <a href="#" onclick="showForgotPassword(event)">Forgot Password?</a>
        </div>

        <div class="auth-footer">
          Don't have an account? <a href="register.html">Sign Up</a>
        </div>
      </form>

      <form class="auth-form" id="forgotForm" style="display: none;">
        <div class="error-message" id="forgotErrorMsg"></div>
        <div class="success-message" id="forgotSuccessMsg"></div>

        <div class="form-group">
          <label for="forgotEmail">Email Address</label>
          <input type="email" id="forgotEmail" placeholder="you@example.com" required>
        </div>

        <button type="submit" class="btn btn-primary submit-btn">Send Reset Link</button>

        <div class="auth-footer">
          <a href="#" onclick="showLoginForm(event)">Back to Login</a>
        </div>
      </form>
    </div>
  </main>

  <footer class="footer"></footer>

  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script>
    function init() {
      renderHeader();
      renderFooter();

      if (Auth.isLoggedIn()) {
        window.location.href = 'index.html';
        return;
      }
    }

    function togglePassword(fieldId) {
      const field = document.getElementById(fieldId);
      const btn = field.nextElementSibling;
      if (field.type === 'password') {
        field.type = 'text';
        btn.textContent = '🙈';
      } else {
        field.type = 'password';
        btn.textContent = '👁';
      }
    }

    function showError(elementId, message) {
      const el = document.getElementById(elementId);
      el.textContent = message;
      el.classList.add('show');
    }

    function hideError(elementId) {
      document.getElementById(elementId).classList.remove('show');
    }

    function showSuccess(elementId, message) {
      const el = document.getElementById(elementId);
      el.textContent = message;
      el.classList.add('show');
    }

    function showForgotPassword(e) {
      e.preventDefault();
      document.getElementById('loginForm').style.display = 'none';
      document.getElementById('forgotForm').style.display = 'block';
    }

    function showLoginForm(e) {
      e.preventDefault();
      document.getElementById('forgotForm').style.display = 'none';
      document.getElementById('loginForm').style.display = 'block';
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError('errorMsg');

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        await Auth.login(email, password);
        showToast('Login successful!', 'success');
        setTimeout(() => window.location.href = 'index.html', 500);
      } catch (err) {
        showError('errorMsg', err.message);
      }
    });

    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError('forgotErrorMsg');

      const email = document.getElementById('forgotEmail').value;

      try {
        const data = await Auth.forgotPassword(email);
        showSuccess('forgotSuccessMsg', 'Reset link sent! Check console for token (dev mode).');
        console.log('Reset Token:', data.resetToken);
        console.log('Reset URL:', data.resetUrl);
      } catch (err) {
        showError('forgotErrorMsg', err.message);
      }
    });

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
