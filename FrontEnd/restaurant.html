<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restaurant Menu - FoodieHub</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/restaurant.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <header class="header"></header>

  <main>
    <section class="restaurant-hero" id="restaurantHero"></section>

    <div class="container">
      <div class="menu-layout">
        <aside class="menu-sidebar" id="menuSidebar"></aside>
        <section class="menu-content">
          <div class="menu-grid" id="menuGrid"></div>
        </section>
      </div>
    </div>
  </main>

  <div class="modal-overlay" id="itemModal">
    <div class="modal">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <div class="floating-cart" id="floatingCart" style="display: none;">
    <a href="cart.html" class="btn btn-primary btn-lg">
      🛒 View Cart (<span id="floatingCount">0</span>) • <span id="floatingTotal">₹0</span>
    </a>
  </div>

  <footer class="footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/restaurant.js"></script>
</body>
</html>
